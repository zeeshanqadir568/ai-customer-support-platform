[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-support-platform"
version = "0.1.0"
description = "Agentic AI customer support demo: reason-act loop, business tools, human escalation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Zeeshan Qadir" }
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "anthropic>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
]

[project.scripts]
support-platform = "app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api = ["web/*.html"]
